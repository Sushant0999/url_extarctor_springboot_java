micronaut:
  application:
    name: urlExtractor
  server:
    port: ${PORT:8080}
    cors:
      enabled: true
      configurations:
        all:
          allowed-origins:
            - "http://localhost:3000"
            - "http://localhost:5173"
            - "https://url-extarctor-springboot-java.vercel.app"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "*"
          max-age: 3600
    multipart:
      max-file-size: 25MB
  router:
    static-resources:
      swagger:
        enabled: true
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        enabled: true
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

endpoints:
  all:
    enabled: true
    sensitive: false

# Groq API Configuration
groq:
  api:
    key: ${GROQ_API_KEY:}
    url: https://api.groq.com/openai/v1/chat/completions

# RabbitMQ Configuration
rabbitmq:
  uri: amqp://${RABBITMQ_USER:guest}:${RABBITMQ_PASSWORD:guest}@${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}

# Custom Application Flags
app:
  rabbitmq:
    enabled: false
  allowed:
    origins: "http://localhost:3000,http://localhost:5173,https://url-extarctor-springboot-java.vercel.app"
